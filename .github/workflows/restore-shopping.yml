name: Restore Travelcheck Shopping
on:
  push:
    paths:
      - '.github/workflows/restore-shopping.yml'
      - 'scripts/restore_shopping.py'
      - 'scripts/add_shopping_reminder.py'
      - 'scripts/fix_reminder_timing.py'
      - 'scripts/centralize_item_classification.py'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/restore_shopping.py
      - run: python scripts/add_shopping_reminder.py
      - run: python scripts/fix_reminder_timing.py
      - run: python scripts/centralize_item_classification.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Centralize preparation and shopping classification"
          git push
